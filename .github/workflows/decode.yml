name: decode-images
on:
  push:
    paths: ['b64/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: decode
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          if [ ! -d b64 ]; then echo "no b64 dir"; exit 0; fi
          find b64 -name '*.b64.part*' | sed 's/\.part[0-9]*$//' | sort -u | while read b; do
            ls "$b".part* | sort | xargs cat > "$b"
            rm -f "$b".part*
          done
          find b64 -name '*.b64' | while read f; do
            out="${f#b64/}"; out="${out%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
          done
          rm -rf b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Decode images" || echo nothing
          git pull --rebase || true
          git push
