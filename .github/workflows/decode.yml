name: decode-images
on:
  push:
    paths: ['b64/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          find b64 -name '*.b64' | while read f; do
            out="${f#b64/}"; out="${out%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
          done
          rm -rf b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Decode images" || echo nothing
          git push
