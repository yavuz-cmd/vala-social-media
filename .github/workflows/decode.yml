name: decode-images
on:
  push:
    paths: ['b64/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: decode
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          set -e
          if [ ! -d b64 ]; then echo "no b64 dir"; exit 0; fi
          # chunked files: assemble only when <name>.b64.done marker exists
          find b64 -name '*.b64.done' | while read d; do
            b="${d%.done}"
            ls "$b".part* | sort | xargs cat > "$b"
            git rm -q --cached "$b".part* "$d" 2>/dev/null || true
            rm -f "$b".part* "$d"
          done
          find b64 -name '*.b64' | while read f; do
            out="${f#b64/}"; out="${out%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
            git rm -q --cached "$f" 2>/dev/null || true
            rm -f "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Decode images" || { echo "nothing to commit"; exit 0; }
          # retry push on races with concurrent uploads; never fail the run for a lost race
          for i in 1 2 3 4 5 6; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*5))
          done
          echo "push lost race repeatedly; next run will finish the job"
          exit 0
